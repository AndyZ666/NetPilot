! ============================================================
! NetPilot generated configuration
! Source of Truth: inventory/devices.yml
! Device: S2
! ============================================================
!
hostname S2
!


vlan 10
   name VLAN0010
!

vlan 20
   name VLAN0020
!

vlan 30
   name VLAN0030
!

vlan 900
   name VLAN0900
!











interface Ethernet1
   description TO-R2
   no switchport
   ip address 10.2.22.2/30
   ipv6 address 2001:db8:2:22::2/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!

interface Ethernet2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30,900
   no shutdown
!

interface Ethernet3
   switchport mode access
   switchport access vlan 10
   no shutdown
!

interface Ethernet4
   switchport mode access
   switchport access vlan 30
   no shutdown
!

interface Management0
   ip address 172.20.20.8/24
   ipv6 address 3fff:172:20:20::8/64
   no shutdown
!

interface Vlan900
   ip address 10.12.12.2/30
   ipv6 address 2001:db8:12:12::2/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!



ip prefix-list RIP-CONNECTED-S2 seq 10 permit 10.12.12.0/30
ip prefix-list RIP-CONNECTED-S2 seq 20 permit 10.2.22.0/30



route-map RIP-CONNECTED-S2 permit 10
   match ip address prefix-list RIP-CONNECTED-S2
!





ipv6 router ospf 10
   router-id 22.22.22.22
!



router rip
   network 10.2.22.0/30
   network 10.12.12.0/30
   redistribute connected route-map RIP-CONNECTED-S2
!



end
