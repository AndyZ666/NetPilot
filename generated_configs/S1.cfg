!
hostname S1
!


vlan 10
   name VLAN0010
!

vlan 20
   name VLAN0020
!

vlan 30
   name VLAN0030
!

vlan 900
   name TRANSIT-S1-S2
!

















interface Ethernet1
   no switchport
   ip address 10.1.11.2/30
   ipv6 address 2001:db8:1:11::2/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!

interface Ethernet2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30,900
   no shutdown
!

interface Ethernet3
   switchport mode access
   switchport access vlan 10
   no shutdown
!

interface Ethernet4
   switchport mode access
   switchport access vlan 20
   no shutdown
!

interface Management0
   ip address 172.20.20.7/24
   ipv6 address 3fff:172:20:20::7/64
   no shutdown
!

interface Vlan1
   no shutdown
!

interface Vlan10
   description GATEWAY-VLAN10
   ip address 10.0.10.1/24
   ipv6 address 2001:db8:10::1/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!

interface Vlan20
   description GATEWAY-VLAN20
   ip address 10.0.20.1/24
   ipv6 address 2001:db8:20::1/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!

interface Vlan30
   description GATEWAY-VLAN30
   ipv6 address 2001:db8:30::1/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!

interface Vlan900
   description L3-transit-to-S2
   ip address 10.12.12.1/30
   ipv6 address 2001:db8:12:12::1/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!



ip prefix-list RIP-CONNECTED-S1 seq 10 permit 10.0.10.0/24
ip prefix-list RIP-CONNECTED-S1 seq 20 permit 10.0.20.0/24
ip prefix-list RIP-CONNECTED-S1 seq 30 permit 10.1.11.0/30
ip prefix-list RIP-CONNECTED-S1 seq 40 permit 10.12.12.0/30



route-map RIP-CONNECTED-S1 permit 10
   match ip address prefix-list RIP-CONNECTED-S1
!





ipv6 router ospf 10
   router-id 11.11.11.11
   passive-interface Vlan10
   passive-interface Vlan20
   passive-interface Vlan30
!



router rip
   network 10.1.11.0/30
   network 10.12.12.0/30
   redistribute connected route-map RIP-CONNECTED-S1
!



end
