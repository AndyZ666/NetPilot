! ============================================================
! NetPilot generated configuration
! Source of Truth: inventory/devices.yml
! Device: R2
! ============================================================
!
hostname R2
!












interface Ethernet1
   description to-S4-eth3
   no switchport
   ip address 10.2.44.1/30
   ipv6 address 2001:db8:2:44::1/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!

interface Ethernet2
   no switchport
   ip address 10.2.22.1/30
   ipv6 address 2001:db8:2:22::1/64
   ipv6 ospf 10 area 0.0.0.0
   no shutdown
!

interface Management0
   ip address 172.20.20.14/24
   ipv6 address 3fff:172:20:20::e/64
   no shutdown
!



ip prefix-list CORE-OSPF-PREFIXES seq 10 permit 10.1.33.0/30
ip prefix-list CORE-OSPF-PREFIXES seq 20 permit 10.2.44.0/30
ip prefix-list CORE-OSPF-PREFIXES seq 30 permit 10.3.33.0/30
ip prefix-list CORE-OSPF-PREFIXES seq 40 permit 10.4.44.0/30
ip prefix-list CORE-OSPF-PREFIXES seq 50 permit 10.33.44.0/30
ip prefix-list CORE-OSPF-PREFIXES seq 60 permit 10.3.4.0/30
ip prefix-list CORE-OSPF-PREFIXES seq 70 permit 203.0.113.0/30

ip prefix-list LOWER-RIP-PREFIXES seq 10 permit 10.0.10.0/24
ip prefix-list LOWER-RIP-PREFIXES seq 20 permit 10.0.20.0/24
ip prefix-list LOWER-RIP-PREFIXES seq 30 permit 10.1.11.0/30
ip prefix-list LOWER-RIP-PREFIXES seq 40 permit 10.12.12.0/30
ip prefix-list LOWER-RIP-PREFIXES seq 50 permit 10.2.22.0/30

ip prefix-list rip-connected-r2 seq 10 permit 10.2.22.0/30



route-map OSPF-TO-RIP permit 10
   match ip address prefix-list CORE-OSPF-PREFIXES
!

route-map R2-connected-to-ospf permit 10
   match ip address prefix-list LOWER-RIP-PREFIXES
!

route-map RIP-TO-OSPF permit 10
   match ip address prefix-list LOWER-RIP-PREFIXES
!

route-map rip-connected-r2 permit 10
   match ip address prefix-list rip-connected-r2
!



router ospf 10
   router-id 2.2.2.2
   network 10.2.44.0/30 area 0.0.0.0
   redistribute connected route-map R2-connected-to-ospf
   redistribute rip route-map RIP-TO-OSPF
!



ipv6 router ospf 10
   router-id 2.2.2.2
!



router rip
   network 10.2.22.0/30
   redistribute ospf match internal route-map OSPF-TO-RIP
   redistribute ospf match external route-map OSPF-TO-RIP
   redistribute connected route-map rip-connected-r2
!



end
