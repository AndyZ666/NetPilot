  collection_method: Read-only EOS show commands through docker exec Cli -p 15 -c
  conventions:
    'null': Unconfirmed or not applicable; protocol absence is separately recorded in protocols_not_configured.
      No default values are assumed.
    empty_list: Confirmed no entries in the collected configuration or operational output.
    addresses: IPv4/IPv6 interface prefixes include configured and observed addresses; IPv6 link-local is separate.
      EOS unassigned 0.0.0.0/0 placeholders are excluded.
    shutdown: Explicit configuration or observed up state confirms administrative state; an otherwise ambiguous
      down state is null.
    topology_peers: Peer endpoints come from nettopo.clab.yml; ethN is mapped to an observed EOS EthernetN interface.
      LLDP confirmation is recorded independently.
    bgp_networks: Configured origination statements and observed per-neighbor advertisements are recorded separately.
