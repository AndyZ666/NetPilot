name: pilot-network

# Reuse the existing Docker management network and both observed IPAM subnets.
mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: 3fff:172:20:20::/64

topology:
  kinds:
    ceos:
      image: ceos:4.36.2F
    linux:
      image: wbitt/network-multitool:latest
  
  
    # Identifiy R1-R5, S1-S4, H1-H4 & Web Server
  nodes:
    R1:
      kind: ceos
    
    R2:
      kind: ceos
      
    R3:
      kind: ceos
      
    R4:
      kind: ceos
      
    R5:
      kind: ceos

    # Pending Lab 8 routers: native ZTP, with Ethernet1 reserved for bootstrap.
    R6:
      kind: ceos
      image-pull-policy: Never
      mgmt-ipv4: 172.20.20.30
      suppress-startup-config: true
    R7:
      kind: ceos
      image-pull-policy: Never
      mgmt-ipv4: 172.20.20.31
      suppress-startup-config: true

    # Layer3 switches
    S1:
      kind: ceos
    S2:
      kind: ceos
    S3:
      kind: ceos
    S4:
      kind: ceos

    #Hosts
    H1:
      kind: linux
      exec:
        - ip -4 addr flush dev eth1
        - ip -6 addr flush dev eth1 scope global
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sh -c "ip -6 route del default dev eth0 2>/dev/null || true"
        - udhcpc -i eth1 -b -p /run/udhcpc-eth1.pid
        - udhcpc6 -i eth1 -b -p /run/udhcpc6-eth1.pid
    H2:
      kind: linux
      exec:
        - ip -4 addr flush dev eth1
        - ip -6 addr flush dev eth1 scope global
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sh -c "ip -6 route del default dev eth0 2>/dev/null || true"
        - udhcpc -i eth1 -b -p /run/udhcpc-eth1.pid
        - udhcpc6 -i eth1 -b -p /run/udhcpc6-eth1.pid
    H3:
      kind: linux
      exec:
        - ip -4 addr flush dev eth1
        - ip -6 addr flush dev eth1 scope global
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sh -c "ip -6 route del default dev eth0 2>/dev/null || true"
        - udhcpc -i eth1 -b -p /run/udhcpc-eth1.pid
        - udhcpc6 -i eth1 -b -p /run/udhcpc6-eth1.pid
    H4:
      kind: linux
      exec:
        - ip -4 addr flush dev eth1
        - ip -6 addr flush dev eth1 scope global
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sh -c "ip -6 route del default dev eth0 2>/dev/null || true"
        - udhcpc6 -i eth1 -b -p /run/udhcpc6-eth1.pid

    H5:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
        - ip -4 addr flush dev eth1
        - ip -6 addr flush dev eth1 scope global
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sh -c "ip -6 route del default dev eth0 2>/dev/null || true"
        - udhcpc -i eth1 -b -p /run/udhcpc-eth1.pid
        - udhcpc6 -i eth1 -b -p /run/udhcpc6-eth1.pid

    #Web-server
    web-server:
      kind: linux
      image: nginx:alpine
      exec:
        - ip addr add 203.0.113.2/30 dev eth1
        - ip -6 addr add 2001:db8:203:113::2/64 dev eth1
        - ip route add 10.0.0.0/8 via 203.0.113.1 dev eth1
        - ip -6 route route add default via 2001:db8:203:113::1
        - ip -6 route replace 2001:db8::/32 via 2001:db8:203:113::1 dev eth1 src 2001:db8:203:113::2 
        - sh -c 'echo "hello world" > /usr/share/nginx/html/index.html'

    R8:
      kind: ceos
      image: ceos:4.36.2F
      image-pull-policy: Never
      mgmt-ipv4: 172.20.20.17
      suppress-startup-config: true
      labels:
        netpilot-ztp-job-id: 8ecd7f23f8e9c46309ac373403c2f126
    R9:
      kind: ceos
      image: ceos:4.36.2F
      image-pull-policy: Never
      mgmt-ipv4: 172.20.20.18
      suppress-startup-config: true
      labels:
        netpilot-ztp-job-id: f13c77b05d2db5915556357d596f182e
  links:
  # ==========================================
  # 1. Edge & External Connectivity
  # ==========================================
  # Web Server to  R5
  - endpoints: ["web-server:eth1", "R5:eth1"]

  # ==========================================
  # 2. BGP Core Layer
  # ==========================================
  # R5 to R3 and R4 R3-R4
  - endpoints: ["R5:eth2", "R3:eth1"]
  - endpoints: ["R5:eth3", "R4:eth1"]
  - endpoints: ["R3:eth3", "R4:eth3"]

  # ==========================================
  # 3. OSPF Area 0 Core (OSPF Backbone area)
  # ==========================================
  # R3 and R4 to Switch 3 & 4
  - endpoints: ["R3:eth2", "S3:eth1"]
  - endpoints: ["R4:eth2", "S4:eth1"]

  # S3 to S4
  - endpoints: ["S3:eth2", "S4:eth2"]

  # ==========================================
  # 4. OSPF to RIP Boundary 
  # ==========================================
  # S3, S4 to R1, R2
  - endpoints: ["S3:eth3", "R1:eth1"]
  - endpoints: ["S4:eth3", "R2:eth1"]

  # ==========================================
  # 5. RIP V2 Layer & Access Switches 
  # ==========================================
  # R1, R2 to S1, S2
  - endpoints: ["R1:eth2", "S1:eth1"]
  - endpoints: ["R2:eth2", "S2:eth1"]

  # S1, S2 
  - endpoints: ["S1:eth2", "S2:eth2"]

  # ==========================================
  # 6. End Hosts
  # ==========================================
  # S1 to H1 (VLAN 10) and H2 (VLAN 20)
  - endpoints: ["S1:eth3", "H1:eth1"]
  - endpoints: ["S1:eth4", "H2:eth1"]

  # S2 to H3 (VLAN 10) and H4 (VLAN 30)
  - endpoints: ["S2:eth3", "H3:eth1"]
  - endpoints: ["S2:eth4", "H4:eth1"]

  - endpoints: ["R4:eth4", "R6:eth2"]
  - endpoints: ["R6:eth3", "R7:eth2"]
  - endpoints: ["R7:eth3", "H5:eth1"]

  # Lab 8 bootstrap only: attach these host endpoints with connect-bootstrap.sh.
  # Retire the temporary ztp-clients R6 before reusing npztp-r6 and its MAC.
  - type: host
    endpoint:
      node: R6
      interface: eth1
      mac: aa:c1:ab:da:73:76
    host-interface: npztp-r6
  - type: host
    endpoint:
      node: R7
      interface: eth1
      mac: 02:00:00:08:00:07
    host-interface: npztp-r7
  - type: host
    endpoint:
      node: R8
      interface: eth1
      mac: 02:08:99:c6:6b:8e
    host-interface: npztp-99c66b8e
  - type: host
    endpoint:
      node: R9
      interface: eth1
      mac: 02:08:79:4d:9d:1a
    host-interface: npztp-794d9d1a
