[agent]
  flush_interval = "5s"
  debug = true

[[inputs.gnmi]]
  addresses = [
    "172.20.20.13:6030", # R1
    "172.20.20.14:6030", # R2
    "172.20.20.9:6030",  # R3
    "172.20.20.11:6030", # R4
    "172.20.20.2:6030",  # R5
    "172.20.20.7:6030",  # S1
    "172.20.20.8:6030",  # S2
    "172.20.20.4:6030",  # S3
    "172.20.20.10:6030"  # S4
  ]

  username = "${NETPILOT_USERNAME}"
  password = "${NETPILOT_PASSWORD}"

  encoding = "json_ietf"
  tls_enable = false
  redial = "10s"

  [[inputs.gnmi.subscription]]
    name = "interface_oper_status"
    path = "/interfaces/interface/state/oper-status"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "interface_admin_status"
    path = "/interfaces/interface/state/admin-status"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "interface_counters"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "cpu_utilization"
    path = "/components/component/cpu/utilization/state/instant"
    subscription_mode = "sample"
    sample_interval = "10s"


[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "NetPilot"
  bucket = "telemetry"
