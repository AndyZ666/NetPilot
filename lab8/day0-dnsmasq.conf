# Phase 3B candidate: same isolated DHCP settings; explicit device selection.
port=0
interface=eth1
except-interface=eth0
bind-interfaces
dhcp-authoritative
dhcp-range=10.250.0.100,10.250.0.150,255.255.255.0,1h
# Ethernet1 MACs are pinned in nettopo.clab.yml; never use Management0 MACs.
dhcp-host=aa:c1:ab:da:73:76,set:r6
dhcp-option-force=tag:r6,67,http://10.250.0.1/day0/R6.cfg
dhcp-host=02:00:00:08:00:07,set:r7
dhcp-option-force=tag:r7,67,http://10.250.0.1/day0/R7.cfg
# No default boot URL: unidentified clients receive no device configuration.
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/tmp/dnsmasq.leases
log-dhcp
log-facility=-
