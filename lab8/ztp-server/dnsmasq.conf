# DHCP only on the isolated bootstrap link; no DNS service.
port=0
interface=eth1
except-interface=eth0
bind-interfaces
dhcp-authoritative
dhcp-range=10.250.0.100,10.250.0.150,255.255.255.0,1h
dhcp-option-force=67,http://10.250.0.1/R6.cfg
# The numeric HTTP address is on-link; do not advertise a router or DNS server.
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/tmp/dnsmasq.leases
log-dhcp
log-facility=-
