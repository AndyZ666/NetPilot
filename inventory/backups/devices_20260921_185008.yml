metadata:
  schema_version: 2
  name: NetPilot NSOT
  network_name: pilot-network
  topology_file: nettopo.clab.yml
  source_facts_generated_at_utc: '2026-09-21T21:29:31.305244+00:00'
  source_collection_method: Read-only EOS show commands through docker exec Cli -p 15 -c
  purpose: Normalized desired-state source of truth for NetPilot automation, templating, GUI, and golden-config workflows
  notes:
  - Dynamic operational state such as interface up/down, OSPF DR/BDR state, and live BGP prefix counters is not treated as
    desired-state intent.
  - Device roles are design labels inferred from topology and routing function.
  - RIP is recorded as RIPv2 from the lab topology intent; the EOS collection did not explicitly expose the RIP version.
  - Null-remote-AS BGP activation-only entries on R4 are excluded from intended neighbors and preserved under validation_notes.
network:
  management:
    ipv4_subnet: 172.20.20.0/24
    nmas_ipv4: 172.20.20.1
  defaults:
    vendor: Arista
    platform: cEOSLab
    software_version: 4.36.2F-49692818.4362F (engineering build)
    template: templates/arista_ceos.j2
  management_services:
    ssh:
      enabled: true
      port: 22
    netconf:
      enabled: true
      port: 830
      source: previous_lab_verified_baseline
    gnmi:
      enabled: true
      port: 6030
      source: previous_lab_verified_baseline
    snmp:
      enabled: true
      version: v2c
      source: previous_lab_verified_baseline
routing_domains:
