    protocol: ospfv2
    address_family: ipv4
    process_id: 10
    area: 0.0.0.0
    members:
    - R1
    - R2
    - R3
    - R4
    - S3
    - S4
  ospfv3_ipv6:
    protocol: ospfv3
    address_family: ipv6
    process_id: 10
    area: 0.0.0.0
    members:
    - R1
    - R2
    - R3
    - R4
    - S1
    - S2
    - S3
    - S4
  ripv2_access:
    protocol: ripv2
    address_family: ipv4
    members:
    - R1
    - R2
    - S1
    - S2
  bgp_edge:
    protocol: bgp
    address_families:
    - ipv4
    - ipv6
    autonomous_systems:
      65001:
      - R3
      - R4
      65000:
      - R5
    sessions:
    - local: R3
      remote: R5
      ipv4: 10.3.5.1<->10.3.5.2
      ipv6: 2001:db8:3:5::1<->2001:db8:3:5::2
    - local: R4
      remote: R5
      ipv4: 10.4.5.1<->10.4.5.2
      ipv6: 2001:db8:4:5::1<->2001:db8:4:5::2
